name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.

        **Privacy warning:** Do not attach `.rhcap` captures, logs, databases,
        tokens, account exports, or unredacted player/session data. Describe
        what evidence you have first so a maintainer can arrange safe review
        if needed.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - Live Feed
        - Quests Panel
        - Missions Panel
        - Loot History Panel
        - Combat History Panel
        - Trophy Hall Panel
        - Treasury Panel
        - Vault Panel
        - Characters Panel
        - Exaltations Panel
        - Party Panel
        - Chat Panel
        - Settings
        - Network/Capture
        - UI/Display
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: Describe expected behavior...

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...

  - type: input
    id: version
    attributes:
      label: RealmHound Version
      description: Which version are you using?
      placeholder: "v0.20.2"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: Which Windows version and build are you using?
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized Diagnostic Details
      description: Paste only the minimal relevant text after removing names, tokens, account details, and session data.
      placeholder: Optional sanitized error messages or log lines
