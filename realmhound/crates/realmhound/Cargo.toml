[package]
name = "RealmHound"
description = "A packet sniffer for Realm of the Mad God"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "RealmHound"
path = "src/main.rs"

[dependencies]
# Internal crates
realmhound-core = { path = "../realmhound-core" }

# Async runtime
tokio = { workspace = true }

# GUI
eframe = { workspace = true }
egui = { workspace = true }

# shadcn-style themed widgets (pinned: API is unstable)
egui-shadcn = "=0.5.0"

# Image loading for sprites
image = "0.25"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Error handling
anyhow = { workspace = true }

# File system utilities
dirs = "5.0"

# Utilities
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# Audio playback for sound notifications
rodio = "0.19"

# Native file dialogs for custom sound selection, and message boxes off Windows
rfd = "0.15"

# Profiling (opt-in via the `profiling` feature)
puffin = { version = "0.20", optional = true }
puffin_egui = { version = "0.30", optional = true }
puffin_http = { version = "0.17", optional = true }

# Windows API for single-instance mutex and title-bar icon
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
# Clipboard reads and background writes for the dungeon callout (Windows uses the Win32 API).
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
# Advisory lock file standing in for the Windows named single-instance mutex.
fs2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Process start-time conversion for the Refresh safety gate's /proc lookup.
libc = "0.2"
# Overlay windows on X11/XWayland: choosing the X11 backend on a Wayland session
# (winit is eframe's own copy) and the window-manager hints, pointer polling and
# restacking the overlays need. All three are already in the tree through eframe.
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.13"
# Pre-flights the same runtime-loaded X libraries winit needs, so a Wayland
# session without a usable XWayland stays native instead of failing to start.
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
# Socket -> owning process lookup for the forge-fire relaunch safeguard,
# replacing GetExtendedTcpTable/GetProcessTimes.
libproc = "0.14"
# Overlay window promotion: winit's always-on-top maps to NSFloatingWindowLevel,
# which sits *below* a game in native Full Screen mode. Raising the overlay to
# NSScreenSaverWindowLevel with an all-Spaces collection behavior needs AppKit.
# AppKit's Dock tile is also the only place a bundle-less binary can show an
# icon, and NSBundle tells a bundled build apart.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSEvent",
    "NSImage",
    "NSResponder",
    "NSScreen",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData"] }

[dev-dependencies]
# Hermetic temporary directories for path-injection tests.
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
# Enable the in-app puffin profiler overlay (toggle with F12) and pipeline scopes.
profiling = ["dep:puffin", "dep:puffin_egui", "dep:puffin_http", "realmhound-core/profiling"]
# Enable diagnostic-only capture, pipeline, storage, UI, and audio latency logging.
latency-diagnostics = ["realmhound-core/latency-diagnostics"]

# Windows-specific: embed icon and manifest
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
