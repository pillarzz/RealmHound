[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.20.2"
edition = "2021"
authors = ["Lovens & Pillar"]
license = "MIT"
repository = "https://github.com/pillarzz/RealmHound"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Packet capture
pcap = "1.3"
etherparse = "0.14"

# GUI
eframe = "0.33"
egui = "0.33"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }

# Version comparison
semver = "1.0"

# XML parsing
quick-xml = "0.37"

# Utilities
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
